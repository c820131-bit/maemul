<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>고양 내유동</title>
<style>
body{margin:0;background:#f2f4f7;font-family:-apple-system,"Malgun Gothic",sans-serif;color:#222}
header{background:#1f4e79;color:#fff;padding:16px;font-size:20px;font-weight:700;text-align:center}
main{max-width:900px;margin:0 auto;padding:10px}
figure{margin:0 0 14px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
img{display:block;width:100%;height:auto}
figcaption{padding:8px 12px;font-size:15px;font-weight:600}
.note{text-align:center;color:#666;font-size:13px;padding:6px 0 20px}
</style></head>
<body><header>고양 내유동</header><main>
<figure><img src="00.jpg" alt="모아보기"><figcaption>모아보기</figcaption></figure>
<figure><img src="01.jpg" loading="lazy" alt="내유동 01 거실전경"><figcaption>내유동 01 거실전경</figcaption></figure>
<figure><img src="02.jpg" loading="lazy" alt="내유동 02 보일러실"><figcaption>내유동 02 보일러실</figcaption></figure>
<figure><img src="03.jpg" loading="lazy" alt="내유동 03 거실 방"><figcaption>내유동 03 거실 방</figcaption></figure>
<figure><img src="04.jpg" loading="lazy" alt="내유동 04 욕실"><figcaption>내유동 04 욕실</figcaption></figure>
<figure><img src="05.jpg" loading="lazy" alt="내유동 05 거실주방"><figcaption>내유동 05 거실주방</figcaption></figure>
<figure><img src="06.jpg" loading="lazy" alt="내유동 06 주방"><figcaption>내유동 06 주방</figcaption></figure>
<figure><img src="07.jpg" loading="lazy" alt="내유동 07 방"><figcaption>내유동 07 방</figcaption></figure>
<figure><img src="08.jpg" loading="lazy" alt="내유동 08 화장실"><figcaption>내유동 08 화장실</figcaption></figure>
<div class="note">사진을 누르면 크게 볼 수 있습니다</div>
</main>
<script>document.querySelectorAll('img').forEach(i=>i.onclick=()=>window.open(i.src,'_blank'));</script>
</body></html>
